# nginx/nginx-frontend.conf - serves static HRM frontend at FRONTEND_PORT (8080)
# and proxies /api to backend container.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers (also set by reverse proxy, but be safe at the edge too)
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header Referrer-Policy         "no-referrer"        always;
    add_header X-XSS-Protection        "1; mode=block"     always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=(self)" always;

    # Light rate limit (per IP)
    limit_req_zone $binary_remote_addr zone=app:10m rate=10r/s;
    limit_req zone=app burst=20 nodelay;

    # Larger payloads for face image uploads
    client_max_body_size 10m;

    # API proxy
    location /api/ {
        proxy_pass         http://hrm_backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: any unknown path -> index.html (but keep /api working)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|png|webp|ico|svg)$ {
        expires 1h;
        try_files $uri =404;
    }
}
